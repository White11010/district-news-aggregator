<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новости районов СПб — для SMM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #eef2f6;
      }

      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background:
          radial-gradient(1200px 600px at 10% -10%, #d7e6f7 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #dde8f0 0%, transparent 50%),
          #eef2f6;
        font-family: Manrope, system-ui, sans-serif;
        color: #5c6b7e;
      }

      .app-boot__spinner {
        width: 44px;
        height: 44px;
        border: 3px solid #d9e6f4;
        border-top-color: #1f4b7a;
        border-radius: 50%;
        animation: app-boot-spin 0.75s linear infinite;
      }

      .app-boot__text {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 500;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="app-boot__spinner" aria-hidden="true"></div>
        <p class="app-boot__text">Загрузка приложения…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
